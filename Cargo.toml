[workspace]
resolver = "2"
members = [
  #"dna/zomes/path_explorer",
  #"dna/zomes/notifications_integrity",
  #"dna/zomes/notifications",
  "dna/zomes/profiles_integrity",
  "dna/zomes/profiles",
  "dna/zomes/delivery_integrity",
  "dna/zomes/delivery",
  "dna/zomes/files_integrity",
  "dna/zomes/files",
  "dna/zomes/tagging_integrity",
  "dna/zomes/tagging",
  #"sweettest" // Don't add this since cargo sucks at target-specific compiliation in workspaces
  ]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.lints.rust]
non_upper_case_globals = "allow"
unused_doc_comments = "allow"
non_camel_case_types = "allow"
non_snake_case = "allow"
unused_attributes = "allow"
ill_formed_attribute_input = "allow"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.8.0", default-features = false, features = ["trace"] }
hdk = { version = "=0.7.0", default-features = false }

# zdk / delivery-zome 0.7 lines, rev-pinned. Never a branch: a branch ref floats, and for a
# zome a non-reproducible build means a non-reproducible DNA hash.
zome_utils = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
zome_path = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
zome_signals = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
zome_core = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816" }
hc_zome_profiles_coordinator = { git = "https://github.com/ddd-mtl/zdk", rev = "1aff80f11db0d7373b76a3ffbd4af65f363f0816", package = "profiles_alt_coordinator" }
hc_zome_profiles_integrity = { git = "https://github.com/holochain-open-dev/profiles", tag = "v0.701.0" }

delivery = { git = "https://github.com/ddd-mtl/delivery-zome", rev = "a464a528a79cdee540b39a56ab447137b5194e8d", package = "delivery" }
zome_delivery_integrity = { git = "https://github.com/ddd-mtl/delivery-zome", rev = "a464a528a79cdee540b39a56ab447137b5194e8d" }
zome_delivery_types = { git = "https://github.com/ddd-mtl/delivery-zome", rev = "a464a528a79cdee540b39a56ab447137b5194e8d" }
zome_delivery_api = { git = "https://github.com/ddd-mtl/delivery-zome", rev = "a464a528a79cdee540b39a56ab447137b5194e8d" }

# First-party integrity zomes, reached through the workspace so no member carries a
# relative path out of its own directory (Gate G2).
zome_files_integrity = { path = "dna/zomes/files_integrity" }
zome_tagging_integrity = { path = "dna/zomes/tagging_integrity" }


[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
#lto = true
lto = false


[workspace.dependencies.notifications]
path = "dna/zomes/notifications"

[workspace.dependencies.notifications_integrity]
path = "dna/zomes/notifications_integrity"

