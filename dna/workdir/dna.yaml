---
manifest_version: "0"
name: dFiles
integrity:
  # WARN: properties might be overridden in the happ.yaml
  properties:
    maxChunkSize: 524288
    maxParcelSize: 1048576000
    maxParcelNameLength: 256
    minParcelNameLength: 1
    maxTagNameLength: 32
    minTagNameLength: 2
  zomes:
    - name: zDeliveryIntegrity
      path: ../../target/wasm32-unknown-unknown/release/delivery_integrity.wasm
    - name: tagging_integrity
      path: ../../target/wasm32-unknown-unknown/release/zome_tagging_integrity.wasm
    #- name: notifications_integrity
    #  path: ../../target/wasm32-unknown-unknown/release/notifications_integrity.wasm
    - name: files_integrity # Must match value defined in integrity zome
      path: ../../target/wasm32-unknown-unknown/release/zome_files_integrity.wasm
    - name: profiles_integrity
      path: ../../target/wasm32-unknown-unknown/release/profiles_integrity_zome.wasm
coordinator:
  zomes:
    #- name: zPathExplorer
    #  path: ../../target/wasm32-unknown-unknown/release/path_explorer.wasm
    - name: zDelivery
      path: ../../target/wasm32-unknown-unknown/release/delivery_zome.wasm
      dependencies:
        - name: zDeliveryIntegrity
    - name: zTagging
      path: ../../target/wasm32-unknown-unknown/release/tagging.wasm
      dependencies:
        - name: tagging_integrity
#    - name: notifications
#      path: ../../target/wasm32-unknown-unknown/release/notifications.wasm
#      dependencies:
#        - name: notifications_integrity
    - name: zFiles # Must match value defined in integrity zome
      path: ../../target/wasm32-unknown-unknown/release/zome_files.wasm
      dependencies:
        - name: files_integrity
    - name: profiles
      path: ../../target/wasm32-unknown-unknown/release/profiles_zome.wasm
      dependencies:
        - name: profiles_integrity
